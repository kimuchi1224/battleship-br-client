<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>海戦バトルロワイヤル</title>
  <style>
    body { font-family: sans-serif; text-align: center; background: #111; color: #fff; margin: 0; padding: 20px; }
    .hidden { display: none !important; }
    #lobby, #game { max-width: 600px; margin: 0 auto; background: #1a1a1a; padding: 20px; border-radius: 8px; border: 1px solid #333; }
    #grid { display: grid; gap: 2px; justify-content: center; margin: 20px auto; }
    .cell { width: 38px; height: 38px; background: #222; border: 1px solid #444; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 9px; cursor: pointer; position: relative; }
    .cell.me { background: #0055ff; }
    .cell.enemy { background: rgba(170, 0, 0, 0.6); }
    .cell.rock { background: #555; }
    .cell.treasure { background: #b8860b; }
    .cell.grass { background: #2e8b57; }
    .cell.safe-out { border: 2px dashed #ff4444; }
    #log { width: 100%; height: 120px; background: #111; margin: 10px auto; padding: 10px; text-align: left; overflow-y: auto; font-size: 11px; border: 1px solid #444; box-sizing: border-box; }
    button { padding: 8px 16px; font-size: 14px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; margin: 5px; }
    button:hover { background: #0056b3; }
    select { padding: 6px; font-size: 14px; margin: 5px; background: #222; color: #fff; border: 1px solid #444; }
  </style>
</head>
<body>
  <h1>海戦バトルロワイヤル</h1>

  <!-- ロビー画面 -->
  <div id="lobby">
    <h2>ロビー</h2>
    <div>
      <label>グリッドサイズ: 
        <select id="gridSizeSelect" onchange="updateSettings()">
          <option value="8">8 x 8</option>
          <option value="10" selected>10 x 10</option>
          <option value="12">12 x 12</option>
        </select>
      </label>
    </div>
    <h3>参加プレイヤー</h3>
    <ul id="playerList" style="list-style: none; padding: 0;"></ul>
    <div>
      <button onclick="toggleReady()">準備完了切り替え</button>
      <button onclick="startGame()" style="background: #28a745;">ゲーム開始</button>
    </div>
  </div>

  <!-- ゲーム画面 -->
  <div id="game" class="hidden">
    <p id="status">自マスの選択状態: 移動先 または 攻撃先を選んでください</p>
    <p id="turnInfo">弾薬: <span id="ammoCount">5</span>発</p>
    
    <div class="controls">
      <button id="modeBtn" onclick="toggleMode()">モード切替: 移動</button>
      <button onclick="sendAction()" style="background: #28a745;">行動確定 (ターン終了)</button>
    </div>

    <div id="grid"></div>

    <h3>ログ</h3>
    <div id="log"></div>
  </div>

  <!-- ⚠️ 実際の Render の URL に書き換えてください -->
  <script src="https://battleship-br.onrender.com/socket.io/socket.io.js"></script>
  <script>
    const socket = io("https://battleship-br.onrender.com");

    let currentSettings = { gridSize: 10 };
    let currentPlayers = {};
    let mapObjects = {};
    let gameState = 'lobby';
    let safeZoneRadius = 5;
    let selectedActionType = 'move';
    let selectedTarget = { x: null, y: null };

    // ロビー用関数
    function updateSettings() {
      const size = document.getElementById('gridSizeSelect').value;
      socket.emit('updateSettings', { gridSize: size });
    }

    function toggleReady() {
      socket.emit('toggleReady');
    }

    function startGame() {
      socket.emit('startGame');
    }

    // ゲーム用関数
    function toggleMode() {
      selectedActionType = (selectedActionType === 'move') ? 'attack' : 'move';
      const modeBtn = document.getElementById('modeBtn');
      modeBtn.innerText = `モード切替: ${selectedActionType === 'move' ? '移動' : '攻撃'}`;
      modeBtn.style.background = selectedActionType === 'move' ? '#007bff' : '#d9534f';
    }

    function selectCell(x, y) {
      selectedTarget = { x, y };
      document.getElementById('status').innerText = `選択中: (${x}, ${y}) [${selectedActionType === 'move' ? '移動先' : '攻撃先'}]`;
    }

    function sendAction() {
      if (selectedTarget.x === null) {
        alert('グリッド上のマスを選択してください');
        return;
      }
      socket.emit('submitAction', {
        type: selectedActionType,
        x: selectedTarget.x,
        y: selectedTarget.y,
        targetX: selectedTarget.x,
        targetY: selectedTarget.y
      });
      document.getElementById('status').innerText = '行動を送信しました。他のプレイヤーを待っています...';
    }

    // --- Socket イベント受信 ---
    socket.on('updateState', (data) => {
      currentPlayers = data.players;
      gameState = data.gameState;
      safeZoneRadius = data.safeZoneRadius || 5;

      if (gameState === 'lobby') {
        document.getElementById('lobby').classList.remove('hidden');
        document.getElementById('game').classList.add('hidden');
        renderPlayerList();
      } else {
        document.getElementById('lobby').classList.add('hidden');
        document.getElementById('game').classList.remove('hidden');
      }
    });

    socket.on('settingsUpdated', (settings) => {
      currentSettings = settings;
      document.getElementById('gridSizeSelect').value = settings.gridSize;
    });

    socket.on('gameStarted', (data) => {
      currentSettings = data.settings;
      mapObjects = data.mapObjects;
      buildGrid(currentSettings.gridSize);
      renderGame();
    });

    socket.on('turnResult', (data) => {
      currentPlayers = data.players;
      mapObjects = data.mapObjects;
      gameState = data.gameState;
      safeZoneRadius = data.safeZoneRadius;

      const logEl = document.getElementById('log');
      data.logs.forEach(msg => {
        const p = document.createElement('p');
        p.innerText = msg;
        logEl.appendChild(p);
      });
      logEl.scrollTop = logEl.scrollHeight;

      renderGame();
    });

    // --- 描画関数 ---
    function renderPlayerList() {
      const listEl = document.getElementById('playerList');
      listEl.innerHTML = '';
      for (let id in currentPlayers) {
        const p = currentPlayers[id];
        const li = document.createElement('li');
        li.innerText = `${p.name} - ${p.ready ? '✅ 準備完了' : '⏳ 待機中'}`;
        listEl.appendChild(li);
      }
    }

    function buildGrid(size) {
      const gridEl = document.getElementById('grid');
      gridEl.style.gridTemplateColumns = `repeat(${size}, 38px)`;
      gridEl.innerHTML = '';

      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.id = `cell-${x}-${y}`;
          cell.onclick = () => selectCell(x, y);
          gridEl.appendChild(cell);
        }
      }
    }

    function renderGame() {
      const size = currentSettings.gridSize || 10;
      const center = Math.floor(size / 2);

      const me = currentPlayers[socket.id];
      if (me) {
        document.getElementById('ammoCount').innerText = me.ammo;
      }

      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const cell = document.getElementById(`cell-${x}-${y}`);
          if (!cell) continue;

          cell.className = 'cell';
          cell.innerText = `${x},${y}`;

          const key = `${x},${y}`;
          // 地形・オブジェクト
          if (mapObjects[key]) {
            const obj = mapObjects[key];
            if (obj.type === 'rock') {
              cell.classList.add('rock');
              cell.innerText = '岩';
            } else if (obj.type === 'treasure') {
              cell.classList.add('treasure');
              cell.innerText = obj.opened ? '空箱' : '宝箱';
            } else if (obj.type === 'grass') {
              cell.classList.add('grass');
              cell.innerText = '草';
            }
          }

          // 安全地帯の外側
          const distFromCenter = Math.max(Math.abs(x - center), Math.abs(y - center));
          if (distFromCenter > safeZoneRadius) {
            cell.classList.add('safe-out');
          }

          // プレイヤー
          for (let id in currentPlayers) {
            const p = currentPlayers[id];
            if (p.x === x && p.y === y && p.alive) {
              if (id === socket.id) {
                cell.classList.add('me');
                cell.innerText = `自HP:${p.hp}`;
              } else {
                cell.classList.add('enemy');
                cell.innerText = `敵`;
              }
            }
          }
        }
      }
    }
  </script>
</body>
</html>
