<!DOCTYPE html> <html lang="ja"> <head> <meta charset="UTF-8"> <title>海戦バトルロワイヤル</title> <style> body { font-family: 'Segoe UI', sans-serif; background: #0d1117; color: #f0f6fc; text-align: center; margin: 0; padding: 20px; } .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 24px; max-width: 800px; margin: 20px auto; } button { background: #238636; color: #fff; border: none; padding: 10px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; font-weight: bold; } button:hover { background: #2ea043; } #grid { display: grid; gap: 2px; justify-content: center; margin: 20px auto; } .cell { width: 45px; height: 45px; background: #21262d; border: 1px solid #30363d; display: flex; align-items: center; justify-content: center; font-size: 11px; cursor: pointer; border-radius: 4px; } .cell.me { background: #1f6feb; color: #fff; font-weight: bold; } .cell.rock { background: #484f58; color: #8b949e; } .cell.chest { background: #9e6a03; color: #fff; } .cell.storm { background: #3d0c0c; opacity: 0.6; } #log { width: 100%; height: 120px; background: #010409; border: 1px solid #30363d; padding: 10px; text-align: left; overflow-y: auto; font-size: 13px; border-radius: 6px; box-sizing: border-box; } .hidden-panel { display: none; } </style> <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"> <body> <h1><i class="fa-solid fa-anchor"></i> 海戦バトルロワイヤル</h1> <!-- ロビー画面 --> <div id="lobbyScreen" class="card"> <h2>待機ロビー</h2> <p>マップサイズ: <input type="number" id="mapSizeInput" value="10" min="6" max="15" style="width:60px; padding:5px; background:#21262d; color:#fff; border:1px solid #30363d;"> マス</p> <button onclick="updateSettings()">設定適用</button> <button onclick="toggleReady()" id="readyBtn" style="background:#1f6feb;">準備完了する</button> <button onclick="startGame()" style="background:#da3633;">ゲーム開始</button> <h3>参加プレイヤー一覧</h3> <ul id="playerList" style="list-style:none; padding:0;"></ul> </div> <!-- ゲーム画面 --> <div id="gameScreen" class="hidden-panel"> <div style="display:flex; justify-content:space-around; margin-bottom:10px;"> <div><b>ターン:</b> <span id="turnNum">1</span></div> <div><b>HP:</b> <span id="myHp">100</span></div> <div><b>弾薬:</b> <span id="myAmmo">5</span></div> <div><b>所持アイテム:</b> <span id="myItems">なし</span></div> </div> <div style="margin-bottom:10px;"> <button id="modeBtn" onclick="toggleMode()" style="background:#8957e5;">モード: 移動先を選択</button> <button onclick="sendAction()" style="background:#238636;">行動決定 (ターン終了)</button> <span id="actionStatus" style="margin-left:15px; color:#f85149;"></span> </div> <div id="grid"></div> <h3>戦闘ログ</h3> <div id="log"></div> </div> <script src="https://battleship-br.onrender.com/socket.io/socket.io.js"></script> <script> const socket = io("https://battleship-br.onrender.com"); let isReadyState = false; let mapSize = 10; let actionType = 'move'; let selectedTarget = { x: null, y: null }; let myId = null; socket.on('connect', () => { myId = socket.id; }); socket.on('lobbyState', (data) => { if(data.gameState === 'playing') { document.getElementById('lobbyScreen').style.display = 'none'; document.getElementById('gameScreen').style.display = 'block'; } mapSize = data.settings.mapSize; let list = document.getElementById('playerList'); list.innerHTML = ''; for(let id in data.players) { let p = data.players[id]; let li = document.createElement('li'); li.innerText = `${p.name} [${p.ready ? '準備完了' : '待機中'}]`; list.appendChild(li); } }); function updateSettings() { let val = document.getElementById('mapSizeInput').value; socket.emit('updateSettings', { mapSize: val }); } function toggleReady() { isReadyState = !isReadyState; let btn = document.getElementById('readyBtn'); btn.innerText = isReadyState ? '準備解除' : '準備完了する'; btn.style.background = isReadyState ? '#238636' : '#1f6feb'; socket.emit('setReady', isReadyState); } function startGame() { socket.emit('startGame'); } socket.on('gameStarted', (data) => { document.getElementById('lobbyScreen').style.display = 'none'; document.getElementById('gameScreen').style.display = 'block'; buildGrid(data.settings.mapSize); }); function buildGrid(size) { let gridEl = document.getElementById('grid'); gridEl.style.gridTemplateColumns = `repeat(${size}, 45px)`; gridEl.innerHTML = ''; for (let y = 0; y < size; y++) { for (let x = 0; x < size; x++) { let cell = document.createElement('div'); cell.className = 'cell'; cell.id = `cell-${x}-${y}`; cell.onclick = () => selectCell(x, y); gridEl.appendChild(cell); } } } function toggleMode() { actionType = (actionType === 'move') ? 'attack' : 'move'; let btn = document.getElementById('modeBtn'); btn.innerText = `モード: ${actionType === 'move' ? '移動先を選択' : '攻撃先を選択'}`; btn.style.background = actionType === 'move' ? '#8957e5' : '#da3633'; } function selectCell(x, y) { selectedTarget = { x, y }; document.getElementById('actionStatus').innerText = `選択中: (${x},${y}) [${actionType === 'move' ? '移動' : '攻撃'}]`; } function sendAction() { if(selectedTarget.x === null) { alert('マスを選択してください'); return; } socket.emit('submitAction', { type: actionType, x: selectedTarget.x, y: selectedTarget.y, targetX: selectedTarget.x, targetY: selectedTarget.y }); document.getElementById('actionStatus').innerText = '行動を送信しました。ターン解決待ち...'; } socket.on('updateState', (data) => { document.getElementById('turnNum').innerText = data.currentTurn; let me = data.players[myId]; if(me) { document.getElementById('myHp').innerText = me.hp; document.getElementById('myAmmo').innerText = me.ammo; document.getElementById('myItems').innerText = me.items.join(', ') || 'なし'; } for (let y = 0; y < mapSize; y++) { for (let x = 0; x < mapSize; x++) { let cell = document.getElementById(`cell-${x}-${y}`); if(!cell) continue; cell.className = 'cell'; cell.innerText = `${x},${y}`; // 安全地帯外（嵐） if (x < data.safeZone.minX || x > data.safeZone.maxX || y < data.safeZone.minY || y > data.safeZone.maxY) { cell.classList.add('storm'); } // 地形オブジェクト (岩・宝箱) let obj = data.gridObjects[`${x},${y}`]; if(obj) { if(obj.type === 'rock') { cell.classList.add('rock'); cell.innerText = '岩'; } else if(obj.type === 'chest' && !obj.opened) { cell.classList.add('chest'); cell.innerText = '宝箱'; } } // プレイヤー位置（フォグ・オブ・ウォー：自分だけ見える） if(me && me.alive && me.x === x && me.y === y) { cell.classList.add('me'); cell.innerText = '自分'; } } } }); socket.on('turnResult', (data) => { let logEl = document.getElementById('log'); data.logs.forEach(msg => { let p = document.createElement('p'); p.innerText = msg; logEl.appendChild(p); }); logEl.scrollTop = logEl.scrollHeight; }); socket.on('gameOver', (data) => { alert(`ゲーム終了！ 勝者: ${data.winner}`); location.reload(); }); </script> </body> </html>
