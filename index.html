<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>海戦バトルロワイヤル</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .hidden { display: none !important; }
    #lobby, #game { max-width: 700px; margin: 0 auto; background: #1e293b; padding: 24px; border-radius: 12px; border: 1px solid #334155; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    
    /* 画面上部ダッシュボード（パラメータ統合） */
    .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; background: #0f172a; padding: 12px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #334155; font-size: 13px; text-align: left; }
    .dashboard div { background: #1e293b; padding: 8px; border-radius: 6px; border: 1px solid #334155; }
    .dashboard span { font-weight: bold; color: #38bdf8; }

    .badge { padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 13px; }
    .badge-move { background: #0284c7; color: white; }
    .badge-attack { background: #0d9488; color: white; }
    .badge-waiting { background: #eab308; color: #1e293b; }

    #grid { display: grid; gap: 4px; justify-content: center; margin: 15px auto; user-select: none; }
    
    .cell { width: 44px; height: 44px; background: #334155; border: 1px solid #475569; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 9px; cursor: pointer; transition: all 0.15s ease; position: relative; }
    
    .elevation-0 { background: #0f172a; }
    .elevation-1 { background: #1e293b; }
    .elevation-2 { background: #334155; }
    .elevation-3 { background: #64748b; font-weight: bold; }

    .cell.in-range-move { border: 2px dashed #38bdf8; background: rgba(3, 105, 161, 0.4); }
    .cell.in-range-attack { border: 2px dashed #2dd4bf; background: rgba(13, 148, 136, 0.4); } 
    .cell.in-range-move:hover, .cell.in-range-attack:hover { transform: scale(1.08); z-index: 10; }

    .cell.selected-move { border: 2px solid #38bdf8 !important; background: #0369a1 !important; }
    .cell.selected-attack { border: 2px solid #2dd4bf !important; background: #0f766e !important; }

    .cell.me { background: #2563eb !important; color: white; font-weight: bold; }
    .cell.enemy { background: #991b1b !important; color: white; }
    .cell.treasure { color: #f59e0b; font-weight: bold; }
    .cell.grass { color: #22c55e; }
    .cell.safe-out { border: 2px dashed #ef4444; background: rgba(239, 68, 68, 0.2); }

    #log { width: 100%; height: 110px; background: #0f172a; margin: 10px auto 0; padding: 10px; text-align: left; overflow-y: auto; font-size: 11px; border: 1px solid #334155; border-radius: 6px; box-sizing: border-box; line-height: 1.4; }
    
    button { padding: 8px 16px; font-size: 13px; font-weight: bold; cursor: pointer; background: #2563eb; color: white; border: none; border-radius: 6px; margin: 4px; transition: background 0.2s; }
    button:hover { background: #1d4ed8; }
    button.btn-danger { background: #e11d48; }
    button.btn-danger:hover { background: #be123c; }
    button.btn-success { background: #16a34a; }
    button.btn-success:hover { background: #15803d; }

    select, input { padding: 6px; font-size: 13px; margin: 4px; background: #0f172a; color: #fff; border: 1px solid #334155; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>⚓ 海戦バトルロワイヤル</h1>

  <!-- ロビー画面 -->
  <div id="lobby">
    <h2>ゲームロビー</h2>
    
    <div style="margin-bottom: 15px;">
      <label>プレイヤー名: 
        <input type="text" id="nameInput" maxlength="15" value="Player">
      </label>
      <button onclick="updateName()">名前変更</button>
    </div>

    <div style="margin-bottom: 10px;">
      <label>マップサイズ: 
        <select id="gridSizeSelect" onchange="updateSettings()" disabled>
          <option value="8">8 x 8</option>
          <option value="10" selected>10 x 10</option>
          <option value="12">12 x 12</option>
        </select>
      </label>
    </div>
    <div style="margin-bottom: 15px;">
      <label>Bot（NPC）数: 
        <select id="botCountSelect" onchange="updateSettings()" disabled>
          <option value="0">0体</option>
          <option value="1">1体</option>
          <option value="2">2体</option>
          <option value="3" selected>3体</option>
          <option value="5">5体</option>
        </select>
      </label>
      <p id="hostNotice" style="font-size: 11px; color: #eab308; margin: 2px 0;">👑 ホストプレイヤーのみ設定を変更・ゲーム開始できます</p>
    </div>

    <h3>参加プレイヤー</h3>
    <ul id="playerList" style="list-style: none; padding: 0; margin-bottom: 15px;"></ul>
    <div>
      <button id="readyBtn" onclick="toggleReady()">準備完了</button>
      <button id="startBtn" class="btn-success" onclick="startGame()" disabled>ゲーム開始 (ホスト専用)</button>
    </div>
  </div>

  <!-- ゲーム画面 -->
  <div id="game" class="hidden">
    <!-- 画面上部パラメータ・ダッシュボード -->
    <div class="dashboard">
      <div>モード: <span id="modeBadge" class="badge badge-move">移動</span></div>
      <div>選択位置: <span id="targetPos">未選択</span></div>
      <div>HP: <span id="myHp">100</span> / 弾薬: <span id="ammoCount">5</span>발</div>
      <div>持ち物: <span id="inventoryList">標準砲弾</span></div>
      <div>生存者数: <span id="aliveCount">0</span>人</div>
      <div>ホスト: <span id="hostName">-</span></div>
    </div>
    
    <div class="controls">
      <button id="modeBtn" onclick="toggleMode()">モード切替 (攻撃に変更)</button>
      <button class="btn-success" onclick="sendAction()">行動確定</button>
      <button id="forceEndBtn" class="btn-danger hidden" onclick="forceEndGame()">ゲーム強制終了 (ホスト)</button>
      <button id="restartBtn" class="btn-danger hidden" onclick="returnToLobby()">ロビーに戻る</button>
    </div>

    <div id="grid"></div>

    <h3>戦闘ログ</h3>
    <div id="log"></div>
  </div>

  <!-- ⚠️ ご自身の Render URL に書き換えてください -->
  <script src="https://battleship-br.onrender.com/socket.io/socket.io.js"></script>
  <script>
    const socket = io("https://battleship-br.onrender.com");

    let currentSettings = { gridSize: 10, botCount: 3 };
    let currentPlayers = {};
    let mapObjects = {};
    let gameState = 'lobby';
    let safeZoneRadius = 5;
    let hostSocketId = null;
    let selectedActionType = 'move';
    let selectedTarget = { x: null, y: null };

    function updateName() {
      const name = document.getElementById('nameInput').value;
      socket.emit('updateName', name);
    }

    function updateSettings() {
      const size = document.getElementById('gridSizeSelect').value;
      const bots = document.getElementById('botCountSelect').value;
      socket.emit('updateSettings', { gridSize: size, botCount: bots });
    }

    function toggleReady() {
      socket.emit('toggleReady');
    }

    function startGame() {
      socket.emit('startGame');
    }

    function forceEndGame() {
      if (confirm('本当にゲームを終了してロビーに戻りますか？')) {
        socket.emit('forceEndGame');
      }
    }

    function returnToLobby() {
      socket.emit('returnToLobby');
    }

    function toggleMode() {
      selectedActionType = (selectedActionType === 'move') ? 'attack' : 'move';
      const modeBtn = document.getElementById('modeBtn');
      const badge = document.getElementById('modeBadge');

      if (selectedActionType === 'move') {
        modeBtn.innerText = 'モード切替 (攻撃に変更)';
        badge.innerText = '移動';
        badge.className = 'badge badge-move';
      } else {
        modeBtn.innerText = 'モード切替 (移動に変更)';
        badge.innerText = '攻撃';
        badge.className = 'badge badge-attack';
      }
      renderGame();
    }

    function selectCell(x, y) {
      const me = currentPlayers[socket.id];
      if (!me) return;

      if (isCellInRange(x, y, me.x, me.y, selectedActionType)) {
        selectedTarget = { x, y };
        document.getElementById('targetPos').innerText = `(${x}, ${y})`;
        renderGame();
      } else {
        alert('そのマスは高低差または射程の制限により選択できません！');
      }
    }

    function isCellInRange(x, y, myX, myY, type) {
      const currentCell = mapObjects[`${myX},${myY}`];
      const targetCell = mapObjects[`${x},${y}`];
      const currentElevation = currentCell ? currentCell.elevation : 1;
      const targetElevation = targetCell ? targetCell.elevation : 1;

      if (type === 'move') {
        const elevationDiff = Math.abs(currentElevation - targetElevation);
        const maxMove = currentElevation >= 2 ? 2 : 1;
        const dist = Math.abs(myX - x) + Math.abs(myY - y);
        return elevationDiff < 2 && dist <= maxMove;
      } else {
        let maxRange = 3;
        if (currentElevation > targetElevation) maxRange += (currentElevation - targetElevation);
        if (currentElevation < targetElevation) maxRange -= (targetElevation - currentElevation);

        const dist = Math.max(Math.abs(myX - x), Math.abs(myY - y));
        return dist <= Math.max(1, maxRange);
      }
    }

    function sendAction() {
      if (selectedTarget.x === null) {
        alert('有効なマスを選択してください');
        return;
      }
      socket.emit('submitAction', {
        type: selectedActionType,
        x: selectedTarget.x,
        y: selectedTarget.y,
        targetX: selectedTarget.x,
        targetY: selectedTarget.y
      });
      
      const badge = document.getElementById('modeBadge');
      badge.innerText = '行動送信済み (待機中)';
      badge.className = 'badge badge-waiting';
    }

    socket.on('updateState', (data) => {
      currentPlayers = data.players;
      gameState = data.gameState;
      safeZoneRadius = data.safeZoneRadius || 5;
      hostSocketId = data.hostSocketId;

      const isHost = (socket.id === hostSocketId);

      // ホスト権限のUI制御
      document.getElementById('gridSizeSelect').disabled = !isHost;
      document.getElementById('botCountSelect').disabled = !isHost;
      const startBtn = document.getElementById('startBtn');
      startBtn.disabled = !isHost;
      startBtn.innerText = isHost ? 'ゲーム開始' : 'ゲーム開始 (ホスト待ち)';

      const forceEndBtn = document.getElementById('forceEndBtn');
      if (isHost && gameState === 'playing') {
        forceEndBtn.classList.remove('hidden');
      } else {
        forceEndBtn.classList.add('hidden');
      }

      if (gameState === 'lobby') {
        document.getElementById('lobby').classList.remove('hidden');
        document.getElementById('game').classList.add('hidden');
        document.getElementById('restartBtn').classList.add('hidden');
        renderPlayerList();
      } else {
        document.getElementById('lobby').classList.add('hidden');
        document.getElementById('game').classList.remove('hidden');

        const gridEl = document.getElementById('grid');
        if (gridEl && gridEl.children.length === 0 && currentSettings.gridSize) {
          buildGrid(currentSettings.gridSize);
        }

        if (gameState === 'ended') {
          document.getElementById('restartBtn').classList.remove('hidden');
          forceEndBtn.classList.add('hidden');
        }
        
        renderGame();
      }
    });

    socket.on('settingsUpdated', (settings) => {
      currentSettings = settings;
      document.getElementById('gridSizeSelect').value = settings.gridSize;
      document.getElementById('botCountSelect').value = settings.botCount;
    });

    socket.on('gameStarted', (data) => {
      currentSettings = data.settings;
      mapObjects = data.mapObjects;
      selectedTarget = { x: null, y: null };
      document.getElementById('targetPos').innerText = '未選択';
      document.getElementById('log').innerHTML = '';
      buildGrid(currentSettings.gridSize);
      renderGame();
    });

    socket.on('turnResult', (data) => {
      currentPlayers = data.players;
      mapObjects = data.mapObjects;
      gameState = data.gameState;
      safeZoneRadius = data.safeZoneRadius;

      const badge = document.getElementById('modeBadge');
      badge.innerText = selectedActionType === 'move' ? '移動' : '攻撃';
      badge.className = selectedActionType === 'move' ? 'badge badge-move' : 'badge badge-attack';

      const logEl = document.getElementById('log');
      data.logs.forEach(msg => {
        const p = document.createElement('div');
        p.innerText = msg;
        logEl.appendChild(p);
      });
      logEl.scrollTop = logEl.scrollHeight;

      if (gameState === 'ended') {
        document.getElementById('restartBtn').classList.remove('hidden');
        document.getElementById('forceEndBtn').classList.add('hidden');
      }

      renderGame();
    });

    function renderPlayerList() {
      const listEl = document.getElementById('playerList');
      listEl.innerHTML = '';
      for (let id in currentPlayers) {
        const p = currentPlayers[id];
        const isHost = (id === hostSocketId);
        const li = document.createElement('li');
        li.style.padding = '6px';
        li.innerText = `${isHost ? '👑 ' : ''}${p.name} - ${p.ready ? '✅ 準備完了' : '⏳ 待機中'}`;
        listEl.appendChild(li);
      }
    }

    function buildGrid(size) {
      const gridEl = document.getElementById('grid');
      gridEl.style.gridTemplateColumns = `repeat(${size}, 44px)`;
      gridEl.innerHTML = '';

      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.id = `cell-${x}-${y}`;
          cell.onclick = () => selectCell(x, y);
          gridEl.appendChild(cell);
        }
      }
    }

    function renderGame() {
      const size = currentSettings.gridSize || 10;
      const center = Math.floor(size / 2);
      const me = currentPlayers[socket.id];
      const hostPlayer = currentPlayers[hostSocketId];

      if (me) {
        document.getElementById('myHp').innerText = me.hp;
        document.getElementById('ammoCount').innerText = me.ammo;
        document.getElementById('inventoryList').innerText = me.inventory.join(', ');
      }
      document.getElementById('hostName').innerText = hostPlayer ? hostPlayer.name : '-';
      document.getElementById('aliveCount').innerText = Object.values(currentPlayers).filter(p => p.alive).length;

      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const cell = document.getElementById(`cell-${x}-${y}`);
          if (!cell) continue;

          cell.className = 'cell';
          const key = `${x},${y}`;
          const cellData = mapObjects[key];
          const elevation = cellData ? cellData.elevation : 1;

          cell.classList.add(`elevation-${elevation}`);
          let label = `H${elevation}`;

          if (cellData) {
            if (cellData.type === 'treasure') {
              cell.classList.add('treasure');
              label = cellData.opened ? '📦' : '🎁';
            } else if (cellData.type === 'grass') {
              cell.classList.add('grass');
              label = '🌿';
            }
          }

          const distFromCenter = Math.max(Math.abs(x - center), Math.abs(y - center));
          if (distFromCenter > safeZoneRadius) {
            cell.classList.add('safe-out');
          }

          if (me && me.alive) {
            if (isCellInRange(x, y, me.x, me.y, selectedActionType)) {
              if (selectedActionType === 'move') {
                cell.classList.add('in-range-move');
              } else {
                cell.classList.add('in-range-attack');
              }
            }
          }

          if (selectedTarget.x === x && selectedTarget.y === y) {
            if (selectedActionType === 'move') {
              cell.classList.add('selected-move');
            } else {
              cell.classList.add('selected-attack');
            }
          }

          for (let id in currentPlayers) {
            const p = currentPlayers[id];
            if (p.x === x && p.y === y && p.alive) {
              if (id === socket.id) {
                cell.classList.add('me');
                label = `自:${p.hp}`;
              } else {
                cell.classList.add('enemy');
                label = p.isBot ? `🤖` : `敵`;
              }
            }
          }

          cell.innerText = label;
        }
      }
    }
  </script>
</body>
</html>
